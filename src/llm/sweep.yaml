program: src/llm/train_sweep.py
method: random

metric:
  name: val/loss
  goal: minimize

parameters:
  max_lr:
    distribution: log_uniform_values
    min: 0.00003
    max: 0.001

  min_lr:
    values: [0.000003, 0.00001, 0.00003]

  batch_size:
    values: [16, 32, 64]

  num_layers:
    value: 4

  d_model:
    value: 512

  num_heads:
    value: 16

  d_ff:
    value: 1344

  weight_decay:
    value: 0.01

  max_iters:
    value: 3000

  eval_interval:
    value: 300

  eval_iters:
    value: 50

  save_checkpoints:
    value: false